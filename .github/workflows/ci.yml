name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/history/**"
      - "data/raw/**"
      - "THESIS.md"
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The generated data is not committed; the type check and the tests read it.
      - run: npm run rebuild
      - run: npm run check:copy
      # Two-source and gas-fee checks over the committed history (src/lib/data-checks.ts).
      - run: npm run check:data
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
